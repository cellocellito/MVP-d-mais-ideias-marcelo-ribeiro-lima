# Opcional: só o MariaDB, já com a tabela e as ideias de exemplo.
services:
  mariadb:
    image: mariadb:12.3
    container_name: dmais-ideias-mariadb
    environment:
      # Nenhuma senha de root no repositório. A aplicação usa o dmais_app.
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      # Sem isso o container roda em UTC, e o criado_em sai 3 horas adiantado.
      TZ: America/Sao_Paulo
    ports:
      # 3307 para não conflitar com um MariaDB local na 3306.
      - "3307:3306"
    volumes:
      # Os scripts rodam só na criação do volume, em ordem alfabética.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dados:/var/lib/mysql
    healthcheck:
      # Faz o `docker compose up --wait` esperar o banco ficar pronto.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados:
